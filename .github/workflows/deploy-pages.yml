name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Build and audit chapter coverage
        run: pnpm build:chapters:deep && pnpm audit:coverage

      - name: Audit navigation
        run: pnpm audit:navigation

      - name: Audit Church study
        run: pnpm audit:church-study

      - name: Audit references
        run: pnpm audit:references

      - name: Audit complete connections
        run: pnpm audit:connections

      - name: Audit editorial quality
        run: pnpm audit:editorial

      - name: Audit accessibility
        run: pnpm audit:accessibility

      - name: Audit atlas assets
        run: pnpm audit:atlas-assets

      - name: Build GitHub Pages
        run: GITHUB_PAGES=true pnpm exec vite build && cp dist/public/index.html dist/public/404.html

      - name: Start Pages preview for route smoke test
        run: python3 scripts/serve-static-base.py --root dist/public --base /biblia-em-visao --host 127.0.0.1 --port 4173 > /tmp/biblia-pages-preview.log 2>&1 &

      - name: Wait for Pages preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/biblia-em-visao/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biblia-pages-preview.log
          exit 1

      - name: Smoke test routes
        env:
          QA_BASE_URL: http://127.0.0.1:4173/biblia-em-visao
        run: pnpm qa:routes

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/public
          force_orphan: false
